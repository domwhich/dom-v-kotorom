{% extends 'base.html' %}
{% block content %}
<h1 class="dom-serif mb-4">{{ _('admin.chats') }}</h1>
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card dom-card">
      <div class="card-body p-4">
        <h5 class="dom-serif mb-3">Новый чат</h5>
        <form method="post">
          <div class="mb-2"><input name="title" class="form-control" placeholder="Название" required></div>
          <div class="mb-2"><input name="url" class="form-control" placeholder="https://t.me/..." required></div>
          <div class="mb-2"><textarea name="description" class="form-control" rows="2" placeholder="Описание (необязательно)"></textarea></div>
          <div class="mb-2"><input name="sort_order" type="number" value="0" class="form-control" placeholder="Порядок"></div>
          <div class="form-check mb-3">
            <input type="checkbox" name="is_visible" class="form-check-input" id="vis" checked>
            <label class="form-check-label" for="vis">Видимый</label>
          </div>
          <button class="btn btn-dom">Добавить</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card dom-card">
      <div class="card-body p-4">
        <h5 class="dom-serif mb-3">Чаты</h5>
        <table class="table align-middle mb-0">
          <thead><tr><th>Название</th><th>Порядок</th><th>Статус</th><th></th></tr></thead>
          <tbody>
          {% for c in chats %}
          <tr>
            <td>{{ c.title }}</td>
            <td>{{ c.sort_order }}</td>
            <td>
              <form method="post" action="{{ url_for('admin.toggle_chat', cid=c.id) }}">
                <button class="btn btn-sm {% if c.is_visible %}btn-success{% else %}btn-secondary{% endif %}">
                  {{ 'Виден' if c.is_visible else 'Скрыт' }}
                </button>
              </form>
            </td>
            <td class="text-end">
              <form method="post" action="{{ url_for('admin.delete_chat', cid=c.id) }}"
                    onsubmit="return confirm('Удалить чат?')">
                <button class="btn btn-sm btn-outline-danger">×</button>
              </form>
            </td>
          </tr>
          {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
